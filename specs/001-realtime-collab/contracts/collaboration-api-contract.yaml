# API Contract: Real-Time Collaboration

## Socket.IO Events (Enhanced)

### 1. join-session
**Direction**: Client → Server
**Purpose**: Request to join a collaborative coding session with authorization check

#### Payload
```json
{
  "sessionKey": "string",
  "userId": "string",
  "token": "string"  // Clerk authentication token
}
```

#### Validation
- `sessionKey` must be a valid session identifier
- `userId` must be a valid authenticated user identifier
- User must be either session owner OR in session's collaborators array
- Valid Clerk authentication token must be provided

#### Server Response
- On success: Joins user to session room, adds user to presence tracking, and notifies other users
- On failure: Emits error event with reason

#### Error Responses
- `{ error: "Session not found" }`
- `{ error: "Access denied to session" }`
- `{ error: "User not authenticated" }`
- `{ error: "Invalid authentication token" }`

### 2. code-change
**Direction**: Client → Server
**Purpose**: Send updated code content to server for broadcasting and persistence

#### Payload
```json
{
  "sessionKey": "string",
  "code": "string",
  "userId": "string",
  "language": "string",
  "fileName": "string"
}
```

#### Validation
- User must be authorized to access the session (owner or collaborator)
- Code content must not exceed size limits
- Session must exist and be active
- Valid Clerk authentication token must be provided

#### Server Response
- Verifies user authorization before processing
- Persists code to MongoDB (Snippet model)
- Emits `code-update` to all other users in the session
- Updates code document with author and timestamp

#### Error Responses
- `{ error: "Invalid session" }`
- `{ error: "Access denied" }`
- `{ error: "Code too large" }`
- `{ error: "User not authorized for this session" }`

### 3. code-update
**Direction**: Server → Clients
**Purpose**: Broadcast updated code to all session participants

#### Payload
```json
{
  "userId": "string",
  "code": "string",
  "language": "string",
  "timestamp": "ISODateString"
}
```

#### Trigger
- Sent by server after receiving valid `code-change` event from authorized user
- Sent to all users in the same session except the sender

### 4. send-message
**Direction**: Client → Server
**Purpose**: Send chat message to other users in the session

#### Payload
```json
{
  "sessionKey": "string",
  "userId": "string",
  "message": "string"
}
```

#### Validation
- User must be authorized to access the session
- Message must not exceed character limits
- Session must exist and be active

#### Server Response
- Saves message to ChatMessage collection
- Emits `receive-message` to all users in the session

### 5. receive-message
**Direction**: Server → Clients
**Purpose**: Deliver chat message to session participants

#### Payload
```json
{
  "senderId": "string",
  "message": "string",
  "timestamp": "ISODateString",
  "messageId": "ObjectId"
}
```

#### Trigger
- Sent by server after receiving valid `send-message` event

### 6. presence-update
**Direction**: Server → Clients
**Purpose**: Notify all session participants about user presence changes

#### Payload
```json
[
  {
    "userId": "string",
    "username": "string",
    "avatarUrl": "string",
    "lastActive": "ISODateString",
    "isOnline": "boolean"
  }
]
```

#### Trigger
- Sent by server when a user joins/leaves a session
- Sent periodically to update presence status

## REST API Endpoints (Extension to existing session API)

### GET /api/sessions/:sessionId/access
**Purpose**: Check if user has access to a specific session

#### Headers
```
Authorization: Bearer <clerk_auth_token>
```

#### Parameters
- `sessionId`: ID of the session to check access for

#### Response (200 OK)
```json
{
  "hasAccess": true,
  "role": "owner|collaborator",
  "sessionInfo": {
    "sessionKey": "string",
    "title": "string",
    "ownerId": "string",
    "collaborators": ["string"],
    "maxParticipants": "number"
  }
}
```

#### Response (403 Forbidden)
```json
{
  "error": "Access denied to session"
}
```

#### Response (404 Not Found)
```json
{
  "error": "Session not found"
}
```

### PUT /api/sessions/:sessionId/collaborators
**Purpose**: Add/remove collaborators to/from a session (Admin Panel feature)

#### Headers
```
Authorization: Bearer <clerk_auth_token>
```

#### Parameters
- `sessionId`: ID of the session to modify

#### Request Body
```json
{
  "action": "add|remove",
  "userId": "string"
}
```

#### Response (200 OK)
```json
{
  "success": true,
  "updatedCollaborators": ["userId1", "userId2", ...],
  "message": "Collaborator added/removed successfully"
}
```

## Authentication Contract

All socket connections must be authenticated using the existing Clerk authentication system.

### Socket Handshake
```javascript
// Server-side verification using Clerk
io.use(async (socket, next) => {
  const token = socket.handshake.auth.token;
  if (!token) {
    return next(new Error('Authentication token required'));
  }

  try {
    // Verify Clerk token
    const decodedToken = await verifyClerkToken(token);
    socket.userId = decodedToken.userId;
    next();
  } catch (err) {
    next(new Error('Invalid authentication token'));
  }
});
```

### Session Authorization
For each collaboration event, server must verify:
1. User is authenticated via Clerk
2. User has access to the specified session (owner or in collaborators[])
3. Session exists and is active
4. User count doesn't exceed maxParticipants limit